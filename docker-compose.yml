version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pricepilot_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=production_secret_key_pricepilot_2026
      - JWT_SECRET_KEY=jwt_production_secret_key_pricepilot_2026
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./instance:/app/instance
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: pricepilot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
